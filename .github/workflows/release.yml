name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.2.1)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/trunk'

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate version format
      run: |
        if [[ ! "${{ github.event.inputs.version }}" =~ ^v[0-9]+\.[0-9]+$ ]]; then
          echo "❌ Invalid version format. Use vX.Y (e.g., v1.2)"
          exit 1
        fi
        echo "✅ Version format is valid: ${{ github.event.inputs.version }}"

    - name: Check if tag already exists
      run: |
        if git tag -l | grep -q "^${{ github.event.inputs.version }}$"; then
          echo "❌ Tag ${{ github.event.inputs.version }} already exists"
          exit 1
        fi
        echo "✅ Tag ${{ github.event.inputs.version }} is available"

    - name: Validate Go version compatibility
      run: |
        GO_MOD_VERSION=$(grep "^go " go.mod | cut -d' ' -f2)
        DOCKERFILE_VERSION=$(grep "FROM golang:" Dockerfile | sed 's/.*golang:\([0-9.]*\).*/\1/')
        GO_MOD_MAJOR_MINOR=$(echo $GO_MOD_VERSION | cut -d. -f1,2)
        DOCKERFILE_MAJOR_MINOR=$(echo $DOCKERFILE_VERSION | cut -d. -f1,2)

        if [ "$GO_MOD_MAJOR_MINOR" != "$DOCKERFILE_MAJOR_MINOR" ]; then
          echo "❌ Go version mismatch! Cannot release."
          exit 1
        fi
        echo "✅ Go versions are compatible"

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Run tests
      run: go test -v

    - name: Build
      run: go build -o coffee-bot main.go

    - name: Test Docker build
      run: docker build -t coffee-bot:${{ github.event.inputs.version }} .

    - name: Create and push tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a ${{ github.event.inputs.version }} -m "Release ${{ github.event.inputs.version }}"
        git push origin ${{ github.event.inputs.version }}
        echo "✅ Tag ${{ github.event.inputs.version }} created and pushed"

    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.event.inputs.version }}
        release_name: ${{ github.event.inputs.version }}
        body: |
          ## Changes

          See commit history for details.
          
          ## Docker Image

          ```bash
          docker pull ghcr.io/shrimpsizemoose/coffee-bot:${{ github.event.inputs.version }}
          ```

          🤖 Generated automatically
        draft: false
        prerelease: false
