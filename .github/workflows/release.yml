name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.2.1)'
        required: true
        type: string
      annotation:
        description: 'Release annotation/tagline (optional)'
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/trunk'

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate version format
      run: |
        if [[ ! "${{ github.event.inputs.version }}" =~ ^v[0-9]+\.[0-9]+$ ]]; then
          echo "❌ Invalid version format. Use vX.Y (e.g., v1.2)"
          exit 1
        fi
        echo "✅ Version format is valid: ${{ github.event.inputs.version }}"

    - name: Check if tag already exists
      run: |
        if git tag -l | grep -q "^${{ github.event.inputs.version }}$"; then
          echo "❌ Tag ${{ github.event.inputs.version }} already exists"
          exit 1
        fi
        echo "✅ Tag ${{ github.event.inputs.version }} is available"

    - name: Validate Go version compatibility
      run: |
        GO_MOD_VERSION=$(grep "^go " go.mod | cut -d' ' -f2)
        DOCKERFILE_VERSION=$(grep "FROM golang:" Dockerfile | sed 's/.*golang:\([0-9.]*\).*/\1/')
        GO_MOD_MAJOR_MINOR=$(echo $GO_MOD_VERSION | cut -d. -f1,2)
        DOCKERFILE_MAJOR_MINOR=$(echo $DOCKERFILE_VERSION | cut -d. -f1,2)

        if [ "$GO_MOD_MAJOR_MINOR" != "$DOCKERFILE_MAJOR_MINOR" ]; then
          echo "❌ Go version mismatch! Cannot release."
          exit 1
        fi
        echo "✅ Go versions are compatible"

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Run tests
      run: go test -v

    - name: Build
      run: go build -o coffee-bot main.go

    - name: Test Docker build
      run: docker build -t coffee-bot:${{ github.event.inputs.version }} .

    - name: Generate changelog
      id: changelog
      run: |
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -z "$PREVIOUS_TAG" ]; then
          echo "No previous tag found, including all commits"
          CHANGELOG=$(git log --pretty=format:"* %s (%h)" --reverse)
        else
          echo "Generating changelog from $PREVIOUS_TAG to HEAD"
          CHANGELOG=$(git log $PREVIOUS_TAG..HEAD --pretty=format:"* %s (%h)" --reverse)
        fi

        # Save changelog to file to handle multiline properly
        echo "$CHANGELOG" > /tmp/changelog.txt
        echo "changelog_file=/tmp/changelog.txt" >> $GITHUB_OUTPUT

    - name: Create and push tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a ${{ github.event.inputs.version }} -m "Release ${{ github.event.inputs.version }}"
        git push origin ${{ github.event.inputs.version }}
        echo "✅ Tag ${{ github.event.inputs.version }} created and pushed"

    - name: Create release body
      id: release_body
      run: |
        BODY_FILE=/tmp/release_body.md

        # Start with annotation if provided
        if [ -n "${{ github.event.inputs.annotation }}" ]; then
          echo "${{ github.event.inputs.annotation }}" > $BODY_FILE
          echo "" >> $BODY_FILE
          echo "" >> $BODY_FILE
        else
          touch $BODY_FILE
        fi

        # Add changelog section
        echo "## Changes" >> $BODY_FILE
        echo "" >> $BODY_FILE
        cat ${{ steps.changelog.outputs.changelog_file }} >> $BODY_FILE
        echo "" >> $BODY_FILE
        echo "" >> $BODY_FILE

        # Add Docker image section
        echo "## Docker Image" >> $BODY_FILE
        echo "" >> $BODY_FILE
        echo '```bash' >> $BODY_FILE
        echo "docker pull ghcr.io/shrimpsizemoose/coffee-bot:${{ github.event.inputs.version }}" >> $BODY_FILE
        echo '```' >> $BODY_FILE
        echo "" >> $BODY_FILE
        echo "🤖 Generated automatically" >> $BODY_FILE

        echo "release_body_file=$BODY_FILE" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.event.inputs.version }}
        release_name: ${{ github.event.inputs.version }}
        body_path: ${{ steps.release_body.outputs.release_body_file }}
        draft: false
        prerelease: false
