name: Build and Test

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    
    - name: Run tests
      run: go test -v
    
    - name: Build
      run: go build -o coffee-bot main.go
    
    - name: Test config parsing
      run: |
        echo "Testing config parsing with test file..."
        timeout 5s ./coffee-bot || echo "Config parsing test completed (timeout expected with fake token)"
      env:
        CONFIG_PATH: config-test.toml